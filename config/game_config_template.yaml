mode: debug # human | ai | debug
language: en
# Legacy integer seed is an internal signed 64-bit value; -1 means automatic.
seed: 1
# For an original-game seed code, replace the seed line above with:
# seed_code: "20261029"
# Quoted legacy strings (seed: "ABC123") are also interpreted as seed codes.
character: Ironclad
ascension: 0  # 0-20, 0 = no ascension
daily_run: false
# Per-character unlock level; missing characters default to 0.
highest_unlocked_ascension: {}
select_overflow: truncate # truncate | reselect
auto_select: False  # Auto select for all modes (human, ai, debug)

human:
  show_menu_option: False

ai:
  api_key: YOUR_API_KEY
  api_base: YOUR_MODEL_API_BASE
  model: YOUR_MODEL
  stream: True
  temperature: 0.7
  max_tokens: 8192
  timeout: 60

debug:
  print: False
  select_type: random
  god_mode: False  # If True, set all enemies to 1 HP at combat start
